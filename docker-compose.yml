version: '3.8'

services:
  # PHP Application - Main service for Coolify
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-bhojon_app}
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - application_cache:/var/www/html/application/cache
      - uploads_data:/var/www/html/uploads
      - uploads_modules:/var/www/html/application/modules/itemmanage/assets/images
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-100M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-100M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-600}
      - DB_HOST=149.28.142.172
      - DB_PORT=3307
      - DB_NAME=bhojon_db
      - DB_USER=root
      - DB_PASS=rfwuJuEXgSRR1vPir1ZXsTbjsgArEVtoXIp3HEP1lZ0lRokffBVPJe6tgC40EmMm
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-tls}
    # depends_on:
    #   - mysql
    networks:
      - bhojon_network
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"

 
volumes:
  mysql_data:
    driver: local
    labels:
      - "coolify.managed=true"
  application_cache:
    driver: local
    labels:
      - "coolify.managed=true"
  uploads_data:
    driver: local
    labels:
      - "coolify.managed=true"
  uploads_modules:
    driver: local
    labels:
      - "coolify.managed=true"

networks:
  bhojon_network:
    driver: bridge
    labels:
      - "coolify.managed=true"

